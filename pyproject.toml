[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marblegen"
version = "0.1.0"
description = "Marble Music - automated marble-run music video generator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "mido>=1.3",
    "imageio-ffmpeg>=0.4",
]

[project.scripts]
marblegen = "marblegen.cli:main"

[tool.setuptools.packages.find]
include = ["marblegen*"]
